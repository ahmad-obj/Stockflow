name: Setup checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify
      - if: runner.os == 'Linux'
        run: ./mvnw -B clean verify
      - name: Launch JavaFX
        if: runner.os == 'Linux'
        run: xvfb-run -a ./mvnw -B javafx:run -Djavafx.args=--smoke
      - name: Start Oracle Database Free
        if: runner.os == 'Linux'
        run: |
          admin_password="Aa1$(openssl rand -hex 12)"
          app_password="Aa1$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$app_password"
          export ORACLE_PASSWORD="$admin_password" STOCKFLOW_DB_PASSWORD="$app_password"
          {
            echo "ORACLE_PASSWORD=$admin_password"
            echo "STOCKFLOW_DB_PASSWORD=$app_password"
          } >> "$GITHUB_ENV"
          docker compose up -d --wait --wait-timeout 240
      - name: Query Oracle through JDBC
        if: runner.os == 'Linux'
        env:
          STOCKFLOW_DB_URL: jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
          STOCKFLOW_DB_USER: stockflow
        run: ./mvnw -B -Dstockflow.oracle.smoke=true -Dtest=OracleConnectionTest test
      - name: Stop Oracle
        if: always() && runner.os == 'Linux' && env.ORACLE_PASSWORD != ''
        run: docker compose down
